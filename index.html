<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>祝辅导员天天开心!</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@300;400;600&display=swap">
<style>
  :root{
    --ink: #c00a1e;
    --ink-soft: rgba(192, 10, 30, 0.55);
    --rose: #FF0D25;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow:hidden;
    background: #ffffff;
    font-family: "Noto Serif SC", system-ui, -apple-system, serif;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  /* ===== 提示文字 ===== */
  .hint{
    position:fixed;
    bottom:22px;
    left:0; right:0;
    text-align:center;
    font-size:12.5px;
    font-weight:300;
    letter-spacing:0.28em;
    text-indent:0.28em;
    color:rgba(192,10,30,.4);
    pointer-events:none;
    opacity:0;
    animation:fade 1.6s ease 2s forwards;
    z-index:2;
  }

  @keyframes fade{
    to{ opacity:1; }
  }

  /* 角落极淡柔光 */
  .glow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    background:
      radial-gradient(circle 340px at 18% 22%, rgba(255,13,37,.05), transparent 70%),
      radial-gradient(circle 380px at 84% 78%, rgba(255,13,37,.05), transparent 70%);
  }

  /* 轮播点击热区与圆点 */
  #hotzone{
    position:fixed;
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:4;
  }
  #dots{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:44px;
    display:flex;
    gap:10px;
    z-index:5;
  }
  #dots span{
    width:9px; height:9px;
    border-radius:50%;
    background:rgba(192,10,30,0.25);
    cursor:pointer;
    transition:all .3s;
  }
  #dots span.active{
    background:#c00a1e;
    transform:scale(1.3);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="glow"></div>
<div id="hotzone" title="点我迸发爱心"></div>


<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- 爱心曲线 ---------- */
  function heartPoint(t, scale){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return { x: x * scale, y: y * scale };
  }

  /* ---------- 预渲染柔光粒子 sprite ---------- */
  function makeSprite(color, mid){
    const s = 64;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.4, mid);
    grad.addColorStop(1, 'rgba(255,13,37,0)');
    g.fillStyle = grad;
    g.fillRect(0,0,s,s);
    return c;
  }
  const sprites = [
    makeSprite('rgba(255,182,188,0.95)', 'rgba(255,95,110,0.5)'),   // 浅红
    makeSprite('rgba(255,90,105,0.95)',  'rgba(255,13,37,0.4)'),    // 中红
    makeSprite('rgba(255,13,37,0.9)',    'rgba(200,0,25,0.32)')     // 正红
  ];

  /* ---------- 背景微光点 ---------- */
  let stars = [];
  function buildStars(){
    stars = [];
    const n = Math.floor(W * H / 12000);
    for(let i=0;i<n;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.1 + 0.3,
        tw: Math.random()*Math.PI*2,
        sp: 0.008 + Math.random()*0.02
      });
    }
  }

  /* ---------- 爱心粒子 ---------- */
  const PARTICLE_COUNT = 2400;
  let particles = [];

  function buildParticles(){
    particles = [];
    const cx = W/2, cy = H/2;
    const scale = Math.min(W, H) / 34;
    for(let i=0;i<PARTICLE_COUNT;i++){
      const t = Math.random()*Math.PI*2;
      const jitter = (Math.random()-0.5)*1.4;
      const jp = heartPoint(t + jitter*0.05, scale*(1 + jitter*0.06));
      const homeX = cx + jp.x;
      const homeY = cy + jp.y;
      const inner = Math.abs(jitter) < 0.4;
      particles.push({
        homeX, homeY,
        x: homeX + (Math.random()-0.5)*220,
        y: homeY + (Math.random()-0.5)*220,
        vx:0, vy:0,
        size: Math.random()*3 + 1.3,
        sprite: inner ? (Math.random()<0.5?0:1) : (Math.random()<0.5?1:2),
        twinkle: Math.random()*Math.PI*2,
        twinkleSpeed: 0.02 + Math.random()*0.04
      });
    }
  }

  function buildAll(){ buildStars(); buildParticles(); }
  buildAll();
  window.addEventListener('resize', buildAll);

  /* ---------- 点击迸发的小爱心（剧烈版） ---------- */
  let bursts = [];
  function spawnBurst(x, y){
    // 主爆发：更多、更快、更大颗
    const n = 48;
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = 2.2 + Math.random()*5.5;
      bursts.push({
        x, y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp - 1.6,
        life: 1,
        decay: 0.009 + Math.random()*0.012,
        size: 5 + Math.random()*11,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.14
      });
    }
    // 二次扩散：延迟一小波，制造层次感
    const m = 18;
    for(let i=0;i<m;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = 0.8 + Math.random()*1.8;
      bursts.push({
        x, y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp - 0.8,
        life: 0.55,                 // 从一半透明度开始
        decay: 0.010 + Math.random()*0.010,
        size: 3 + Math.random()*6,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.10
      });
    }
  }

  /* ---------- 指针交互 ---------- */
  const pointer = { x:null, y:null, active:false };
  function setPointer(x,y){ pointer.x=x; pointer.y=y; pointer.active=true; }
  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('mouseleave', () => pointer.active=false);
  window.addEventListener('touchmove', e => {
    if(e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('touchend', () => pointer.active=false);
  // 点击任意处（包括图片上）：迸发小爱心
  window.addEventListener('click', e => {
    spawnBurst(e.clientX, e.clientY);
  });
  window.addEventListener('touchstart', e => {
    if(e.touches[0]) spawnBurst(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  const REPEL_RADIUS = 60;
  const REPEL_STRENGTH = 9;
  const SPRING = 0.05;
  const FRICTION = 0.90;

  /* ---------- 心跳曲线（柔和双跳） ---------- */
  function heartbeat(time){
    const period = 1.25;
    const t = (time % period) / period;
    const lub = Math.exp(-Math.pow((t-0.12)/0.06, 2));
    const dub = 0.5 * Math.exp(-Math.pow((t-0.34)/0.08, 2));
    return lub + dub;
  }

  /* ---------- 绘制小爱心 ---------- */
  function drawHeart(x, y, size, rot, alpha){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(size/16, size/16);
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(-8, -4, -4, -12, 0, -5);
    ctx.bezierCurveTo(4, -12, 8, -4, 0, 5);
    ctx.closePath();
    ctx.fillStyle = `rgba(255,13,37,${alpha})`;
    ctx.fill();
    ctx.restore();
  }

    ccy = H / 2 + 6 * s0 * CAR_SCALE;
    hotzone.style.width  = cw + 'px';
    hotzone.style.height = chh + 'px';
    hotzone.style.left = ccx + 'px';
    hotzone.style.top  = ccy + 'px';
  }
  window.addEventListener('resize', layoutCarousel);
  layoutCarousel();

  // 心形裁剪路径（单位坐标来自曲线参数，贴合矩形 w×h，中心 ccxP,ccyP）
  function heartClipPath(w, h, ccxP, ccyP){
    ctx.beginPath();
    const N = 64;
    for (let i = 0; i <= N; i++){
      const t = (i / N) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      const px = ccxP + ((x + 16) / 32 - 0.5) * w;
      const py = ccyP + ((y + 5) / 22 - 0.5) * h;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // contain 方式把完整图片放进爱心内接矩形（不裁切）
  function drawContain(img, w, h, ccxP, ccyP, alpha, scaleMult){
    if (!(img.complete && img.naturalWidth)) return;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const fx = ccxP, fy = ccyP + (FIT_CY - 0.5) * h;
    const s = Math.min(w * FIT_W / iw, h * FIT_H / ih) * 0.97 * scaleMult;
    const dw = iw * s, dh = ih * s;
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, fx - dw / 2, fy - dh / 2, dw, dh);
    ctx.globalAlpha = 1;
  }

  function drawCarousel(now, pulse, cx, cy){
    const w = cw * pulse, h = chh * pulse;
    const ccxP = cx + (ccx - cx) * pulse;
    const ccyP = cy + (ccy - cy) * pulse;

    ctx.save();

    // === 抖动特效：轻微位置颤动 + 微小角度摇摆 ===
    // === 按图片区分特效 ===
    // 第1张：只心跳；第2、3张：颤抖+晃动；第5、7张：左右微微晃动；其余：只心跳
    const fx = (next !== -1 ? next : current);
    let jx = 0, jy = 0, rot = 0;
    if (fx === 1 || fx === 2) {
      const jit = 0.9;
      jx = (Math.random() - 0.5) * jit;          // 高频颤抖
      jy = (Math.random() - 0.5) * jit;
      rot = (Math.random() - 0.5) * 0.004        // 微颤角度
          + Math.sin(now * 0.012) * 0.009;       // 缓慢晃动 ±0.5°
    } else if (fx === 4 || fx === 6) {
      jx = Math.sin(now * 0.008) * 3.2;          // 左右微微晃动 ±3.2px
      rot = Math.sin(now * 0.008) * 0.006;       // 轻微跟随摇摆 ±0.35°
    }
    ctx.translate(ccxP + jx, ccyP + jy);
    ctx.rotate(rot);
    ctx.translate(-(ccxP + jx), -(ccyP + jy));

    heartClipPath(w, h, ccxP, ccyP);
    ctx.clip();


    const dx = ccxP + jx, dy = ccyP + jy;
    if (next !== -1){
      drawContain(slides[current], w, h, dx, dy, 1 - fade, 1);
      drawContain(slides[next],     w, h, dx, dy, fade, 1 + (1 - fade) * 0.05);
    } else {
      drawContain(slides[current], w, h, dx, dy, 1, 1);
    }

    ctx.restore();


    // 淡入淡出推进
    fade += (now - lastNow) / 900;
    lastNow = now;
    if (next !== -1 && fade >= 1) finishFade();
  }

  function go(i){
    const target = (i + SLIDES.length) % SLIDES.length;
    if (target === current || next !== -1) return;
    next = target;
    fade = 0;
  }

  function finishFade(){
    current = next;
    next = -1;
    fade = 1;
  }

  let timer = setInterval(() => { if (!paused) go(current + 1); }, 4500);
  function restart(){
    clearInterval(timer);
    timer = setInterval(() => { if (!paused) go(current + 1); }, 4500);
  }

  // 单击爱心：暂停 / 播放轮播

  function tick(now){
    ctx.clearRect(0,0,W,H);
    const time = now/1000;
    const pulse = 1 + heartbeat(time)*0.045;
    const cx = W/2, cy = H/2;

    // 微光背景点
    for(const s of stars){
      s.tw += s.sp;
      const a = 0.18 + Math.sin(s.tw)*0.15;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,13,37,${a.toFixed(2)})`;
      ctx.fill();
    }

    // 爱心轮播（在粒子和微光之下）
    drawCarousel(now, pulse, cx, cy);

    // 爱心粒子
    for(const p of particles){
      const hx = cx + (p.homeX - cx) * pulse;
      const hy = cy + (p.homeY - cy) * pulse;

      let ax = (hx - p.x) * SPRING;
      let ay = (hy - p.y) * SPRING;

      if(pointer.active){
        const dx = p.x - pointer.x;
        const dy = p.y - pointer.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        if(dist < REPEL_RADIUS){
          const force = (1 - dist/REPEL_RADIUS) * REPEL_STRENGTH;
          ax += (dx/dist)*force;
          ay += (dy/dist)*force;
        }
      }

      p.vx = (p.vx + ax) * FRICTION;
      p.vy = (p.vy + ay) * FRICTION;
      p.x += p.vx;
      p.y += p.vy;

      p.twinkle += p.twinkleSpeed;
      const alpha = 0.5 + Math.sin(p.twinkle)*0.35;

      const sprite = sprites[p.sprite];
      const d = p.size * 4;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, p.x - d/2, p.y - d/2, d, d);
    }
    ctx.globalAlpha = 1;

    // 迸发小爱心
    for(let i=bursts.length-1;i>=0;i--){
      const b = bursts[i];
      b.vy += 0.03;
      b.vx *= 0.98;
      b.vy *= 0.985;
      b.x += b.vx;
      b.y += b.vy;
      b.rot += b.vr;
      b.life -= b.decay;
      if(b.life <= 0){ bursts.splice(i,1); continue; }
      drawHeart(b.x, b.y, b.size, b.rot, Math.max(b.life,0)*0.8);
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
